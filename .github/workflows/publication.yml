# ==========================================================
# PUBLICATION AUTOMATIQUE DU SITE
# À chaque modification de la branche main (par toi ou par
# Pages CMS), GitHub :
#   1. construit le site avec Eleventy (dossier _site/) ;
#   2. publie ce dossier sur https://belleville-autogeree.github.io/
# Suivi : onglet « Actions » du dépôt sur github.com.
# Si la construction échoue, rien n'est publié : le site reste
# tel qu'il était à la publication précédente.
# ==========================================================
name: Publication du site

on:
  push:
    branches: [main]
  workflow_dispatch:          # bouton « Run workflow » pour relancer à la main

# Droits nécessaires pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une publication en cours n'est pas interrompue
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---------- 1. Construction ----------
  construction:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Installer Eleventy (versions exactes de package-lock.json)
        run: npm ci

      - name: Construire le site
        run: npm run construire

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site construit
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # ---------- 2. Publication ----------
  publication:
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: publication
        uses: actions/deploy-pages@v4
