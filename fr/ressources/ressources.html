<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ressources – Mobilisation ENSA Paris-Belleville</title>

    <!-- grain.css fournit la texture de bruit (--grain-image), partagée avec l'accueil et l'agenda -->
    <link rel="stylesheet" href="../grain.css">
    <link rel="stylesheet" href="ressources.css">
    <!-- disques.css : les disques Calendrier et Accueil, partagés avec les pages de document -->
    <link rel="stylesheet" href="disques.css">
    <script src="../grain.js" defer></script>
    <!-- defer : le script s'exécute une fois le HTML lu, il trouve donc tous les éléments -->
    <script src="ressources.js" defer></script>
</head>
<body>
    <!-- Fond bleu grainé, fixe derrière toute la page -->
    <div class="fond-grain" aria-hidden="true"></div>

    <!-- ==========================================================
         Les deux disques, en haut à droite (même code que la page agenda,
         styles dans disques.css ; le même HTML est dans _modeles/document.njk) :
         - anneau bordeaux « Accueil », derrière ;
         - disque jaune « Calendrier », devant, même centre, plus petit.
         Chaque disque grossit au survol de son lien ; les liens sont
         dans des calques à part pour ne pas bouger.
         ========================================================== -->
    <div class="cercle-accueil" aria-hidden="true"></div>
    <svg class="calque-accueil" viewBox="0 0 100 100">
        <defs>
            <!-- tracé : centre (50,50), rayon 47, tout près du bord du bordeaux, pour rester dans l'anneau.
                 Il part du haut et tourne par la gauche : 25% = gauche, 37.5% = bas-gauche, 50% = bas.
                 Si un mot est coupé par le bord de l'écran, ajuste startOffset. -->
            <path id="arc-accueil" d="M 50,3 A 47,47 0 1,0 50,97 A 47,47 0 1,0 50,3"/>
        </defs>
        <a class="lien-accueil" href="../home.html">
            <text><textPath id="texte-accueil" href="#arc-accueil" startOffset="37.5%"></textPath></text>
        </a>
    </svg>

    <div class="cercle-calendrier" aria-hidden="true"></div>
    <svg class="calque-calendrier" viewBox="0 0 100 100">
        <defs>
            <!-- tracé : centre (50,50), rayon 44. Il part du HAUT du cercle et tourne par la gauche :
                 0% = haut, 25% = gauche, 37.5% = bas-gauche, 50% = bas. -->
            <path id="arc-calendrier" d="M 50,6 A 44,44 0 1,0 50,94 A 44,44 0 1,0 50,6"/>
        </defs>
        <!-- même adresse que le lien Calendrier de l'accueil -->
        <a class="lien-calendrier" href="../calendar/agenda.html">
            <text><textPath id="texte-calendrier" href="#arc-calendrier" startOffset="37.5%"></textPath></text>
        </a>
    </svg>

    <!-- Titre de la page, pour les lecteurs d'écran -->
    <h1 class="visuellement-masque" id="titre-page"></h1>

    <!-- En haut, fixe : les deux bandeaux de filtres, chacun sur une ligne.
         Il laisse à droite la place des disques. Les boutons sont ajoutés par
         ressources.js, d'après la liste des natures et des pôles de index.json. -->
    <header class="ressources-entete" id="ressources-entete">
        <div class="filtres" id="filtres" hidden>
            <!-- Bandeau 1 : nature du document -->
            <div class="bandeau" role="group" aria-labelledby="titre-natures">
                <span class="bandeau-titre" id="titre-natures"></span>
                <div class="bandeau-boutons" id="bandeau-natures"></div>
            </div>
            <!-- Bandeau 2 : pôle d'organisation (+ « Effacer les filtres » au bout de la ligne) -->
            <div class="bandeau" role="group" aria-labelledby="titre-poles">
                <span class="bandeau-titre" id="titre-poles"></span>
                <div class="bandeau-boutons" id="bandeau-poles"></div>
                <button type="button" class="effacer-filtres" id="effacer-filtres" hidden></button>
            </div>
        </div>
    </header>

    <main class="ressources">
        <!-- Message (chargement impossible, aucun document…), caché tant qu'il n'y a rien à dire -->
        <p class="ressources-message" id="ressources-message" role="status" hidden></p>

        <!-- Les previews, ajoutées par ressources.js -->
        <ul class="liste-ressources" id="liste-ressources"></ul>

        <!-- Sous la liste : combien sont affichés, et le bouton pour en voir plus -->
        <div class="ressources-pied">
            <p class="ressources-compteur" id="ressources-compteur" aria-live="polite"></p>
            <button type="button" class="bouton-voir-plus" id="bouton-voir-plus" hidden></button>
        </div>
    </main>
</body>
</html>
